name: astrbot_plugin_smart_silence
display_name: 智能静默
desc: 让 LLM 根据上下文决定是否发言，避免机器人频繁回复刷屏；支持沉默原因分布与本群发言率报表
help: 无需手动指令，插件自动启用。/静默 状态 查看统计与沉默原因 Top3；/静默 报表 查看本群发言率与原因分布（管理员）；/静默 暂停 [N] 临时暂停 N 分钟；/静默 恢复 恢复；/静默 清空 清空统计；/静默 帮助 查看帮助
version: 1.7.1
author: 云晓
repo: https://github.com/yunxiao258/astrbot_plugin_smart_silence
